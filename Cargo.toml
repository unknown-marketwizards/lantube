[package]
name = "lantube"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "http2", "multipart"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
anyhow = "1.0.104"
base64 = "0.22.1"
ctutils = "0.4.8"
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
toml = "1.1.3"
futures-util = "0.3.33"
tempfile = "3.27.0"
mime_guess = "2.0.5"

[build-dependencies]
tempfile = "3.27.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
