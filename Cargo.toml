[package]
name = "lantube"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "http2", "multipart"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
anyhow = "1.0.104"
toml = "1.1.3"
